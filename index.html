<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYROX Sport Detail 查看器</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e0e4ea;
    --primary: #2f6fed;
    --primary-hover: #1f5bd0;
    --text: #1f2933;
    --muted: #6b7280;
    --header-bg: #f0f4fb;
    --row-hover: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .header { max-width: 1200px; margin: 0 auto 24px; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.6; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin: 0 auto 20px;
    max-width: 1200px;
  }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 28px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
    background: #fafbfc;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--primary);
    background: #eef4ff;
    color: var(--primary);
  }
  .drop-zone input[type=file] { display: none; }
  .drop-zone .icon { font-size: 34px; margin-bottom: 8px; display: block; }
  .file-list { margin-top: 16px; }
  .file-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 6px; background: #fff; font-size: 14px;
  }
  .file-item .name { font-weight: 500; word-break: break-all; }
  .file-item .status { font-size: 12px; }
  .status.ok { color: #16a34a; }
  .status.err { color: #dc2626; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 0; flex-wrap: wrap; }
  .tab {
    padding: 10px 18px; cursor: pointer; border: none; background: transparent;
    font-size: 14px; font-weight: 500; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab .count {
    background: var(--header-bg); color: var(--muted); border-radius: 10px;
    padding: 1px 8px; font-size: 12px; margin-left: 6px;
  }
  .tab.active .count { background: #e3edff; color: var(--primary); }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 0 0; }
  .toolbar-label { font-size: 12px; color: var(--muted); }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border); }
  .btn {
    background: var(--primary); color: #fff; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 500;
    transition: background .2s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn.secondary {
    background: #fff; color: var(--text); border: 1px solid var(--border);
  }
  .btn.secondary:hover { background: var(--header-bg); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 8px; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 100%; }
  thead th {
    position: sticky; top: 0; background: var(--header-bg); color: var(--text);
    font-weight: 600; padding: 10px 12px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--border); z-index: 1;
  }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #eef1f5; white-space: nowrap; }
  tbody tr:hover { background: var(--row-hover); }
  .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
    margin-top: 16px;
  }
  .summary-item {
    background: #fafbfc; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  }
  .summary-item .label { font-size: 12px; color: var(--muted); }
  .summary-item .value { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f2933; color: #fff; padding: 10px 18px; border-radius: 6px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="header">
    <h1>HYROX Sport Detail 查看器</h1>
    <p>选择 <code>_sport_detail.json</code> 文件，浏览器本地解析并展示
       <code>hyroxRepLap</code> / <code>hyroxCounting</code> / <code>hyroxTimelines</code> 三个字段的表格，
       可导出格式化 JSON 或 Excel（.xlsx，三个 Sheet）。
       逻辑与 <code>format_hyrox_structures.py</code> 对齐（删除 rep 时间戳字段、timelines 拆分）。数据不离开本机。</p>
  </div>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <span class="icon">📄</span>
      <div>点击选择或拖拽 JSON 文件到此处（可多选）</div>
      <div style="font-size:12px;margin-top:6px">支持 .json / .txt</div>
    </div>
    <input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain" multiple>
    <div class="file-list" id="fileList"></div>
  </div>

  <div class="card" id="viewerCard" style="display:none">
    <div class="tabs" id="tabs">
      <button class="tab active" data-key="hyroxRepLap">hyroxRepLap<span class="count" id="cntRepLap">0</span></button>
      <button class="tab" data-key="hyroxCounting">hyroxCounting<span class="count" id="cntCounting">0</span></button>
      <button class="tab" data-key="hyroxTimelines">hyroxTimelines<span class="count" id="cntTimelines">0</span></button>
    </div>
    <div class="toolbar">
      <select id="fileSelector" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff"></select>
      <span class="toolbar-label">导出</span>
      <button class="btn secondary" id="btnDownload">格式化 JSON</button>
      <button class="btn secondary" id="btnExcel">Excel (.xlsx)</button>
    </div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="table-wrap" id="tableWrap"></div>
    <div class="meta" id="metaInfo"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---- 状态 ----
  var filesData = {};   // fileName -> { repLap:[], counting:[], timelines:[], raw:{} }
  var activeFile = null;
  var activeTab = 'hyroxRepLap';

  var $ = function (id) { return document.getElementById(id); };
  var dropZone = $('dropZone');
  var fileInput = $('fileInput');
  var viewerCard = $('viewerCard');
  var fileSelector = $('fileSelector');
  var fileList = $('fileList');
  var tabsEl = $('tabs');
  var tableWrap = $('tableWrap');
  var summaryGrid = $('summaryGrid');
  var metaInfo = $('metaInfo');
  var toast = $('toast');

  // ---- 工具函数 ----
  function toastMsg(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }

  // 复刻脚本 parse_json_string_field：字符串则 JSON.parse，空则 []
  function parseJsonStringField(value) {
    if (typeof value === 'string' && value.trim()) {
      try { return JSON.parse(value); }
      catch (e) { return []; }
    }
    if (value === null || value === undefined || value === '') return [];
    return value;
  }

  // 复刻脚本 simplify_rep_laps：删除 rep 时间戳/核心稳定度字段
  function simplifyRepLaps(repLaps) {
    if (!Array.isArray(repLaps)) return [];
    return repLaps.map(function (lap) {
      var clean = {};
      Object.keys(lap || {}).forEach(function (k) {
        if (k === 'rep_start_ms' || k === 'rep_end_ms' || k === 'rep_core_stability') return;
        clean[k] = lap[k];
      });
      return clean;
    });
  }

  // 复刻脚本 parse_timeline_value：分号分隔 -> 逗号分隔 -> field_N
  function parseTimelineValue(value) {
    if (typeof value !== 'string' || !value.trim()) return [];
    var items = [];
    value.split(';').forEach(function (rawItem) {
      rawItem = rawItem.trim();
      if (!rawItem) return;
      var parts = rawItem.split(',').map(function (p) { return p.trim(); });
      var row = {};
      parts.forEach(function (part, idx) {
        row['field_' + (idx + 1)] = (/^-?\d+$/.test(part)) ? parseInt(part, 10) : part;
      });
      items.push(row);
    });
    return items;
  }

  // 提取对象数组的所有键（保持出现顺序）
  function collectKeys(rows) {
    var keys = [];
    var seen = {};
    (Array.isArray(rows) ? rows : []).forEach(function (row) {
      if (!row || typeof row !== 'object') return;
      Object.keys(row).forEach(function (k) {
        if (!seen[k]) { seen[k] = true; keys.push(k); }
      });
    });
    return keys;
  }

  function formatCell(val) {
    if (val === null || val === undefined) return '';
    if (typeof val === 'object') {
      try { return JSON.stringify(val); } catch (e) { return String(val); }
    }
    return String(val);
  }

  // ---- 渲染 ----
  function renderTable(rows) {
    var rowsArr = Array.isArray(rows) ? rows : [];
    if (rowsArr.length === 0) {
      tableWrap.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    var keys = collectKeys(rowsArr);
    var html = '<table><thead><tr><th style="min-width:48px">#</th>';
    keys.forEach(function (k) { html += '<th>' + k.replace(/</g,'&lt;') + '</th>'; });
    html += '</tr></thead><tbody>';
    rowsArr.forEach(function (row, i) {
      html += '<tr><td>' + (i + 1) + '</td>';
      keys.forEach(function (k) {
        html += '<td>' + formatCell(row[k]).replace(/</g,'&lt;') + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
  }

  function renderSummary() {
    if (!filesData[activeFile]) return;
    var d = filesData[activeFile];
    var items = [
      { label: '文件', value: activeFile },
      { label: 'hyroxRepLap 条数', value: (d.repLap || []).length },
      { label: 'hyroxCounting 条数', value: (d.counting || []).length },
      { label: 'hyroxTimelines 条数', value: (d.timelines || []).length },
      { label: 'RepLap 列数', value: collectKeys(d.repLap).length },
      { label: 'Counting 列数', value: collectKeys(d.counting).length }
    ];
    summaryGrid.innerHTML = items.map(function (it) {
      return '<div class="summary-item"><div class="label">' + it.label +
             '</div><div class="value">' + it.value + '</div></div>';
    }).join('');
  }

  function render() {
    if (!activeFile || !filesData[activeFile]) return;
    var d = filesData[activeFile];
    var rows;
    if (activeTab === 'hyroxRepLap') rows = d.repLap;
    else if (activeTab === 'hyroxCounting') rows = d.counting;
    else rows = d.timelines;
    renderTable(rows);
    renderSummary();
    // 更新 tab 计数
    $('cntRepLap').textContent = (d.repLap || []).length;
    $('cntCounting').textContent = (d.counting || []).length;
    $('cntTimelines').textContent = (d.timelines || []).length;
    // 更新文件下拉
    fileSelector.value = activeFile;
    metaInfo.textContent = '当前文件: ' + activeFile;
  }

  // ---- 文件解析 ----
  function parseFile(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var obj = JSON.parse(ev.target.result);
        var repLapRaw = parseJsonStringField(obj.hyroxRepLap);
        var counting = parseJsonStringField(obj.hyroxCounting);
        var timelines = parseTimelineValue(obj.hyroxTimelines);
        filesData[file.name] = {
          repLap: simplifyRepLaps(repLapRaw),
          counting: counting,
          timelines: timelines,
          raw: obj
        };
        markFileStatus(file.name, true, '');
        if (!activeFile) activeFile = file.name;
        populateFileSelector();
        render();
        toastMsg('已解析: ' + file.name);
      } catch (err) {
        markFileStatus(file.name, false, '解析失败: ' + err.message);
      }
    };
    reader.onerror = function () { markFileStatus(file.name, false, '读取失败'); };
    reader.readAsText(file);
  }

  function handleFiles(fileList) {
    Array.prototype.forEach.call(fileList, function (file) {
      addFileItem(file.name);
      parseFile(file);
    });
  }

  function addFileItem(name) {
    if (document.querySelector('.file-item[data-name="' + name.replace(/"/g, '&quot;') + '"]')) return;
    var div = document.createElement('div');
    div.className = 'file-item';
    div.setAttribute('data-name', name);
    div.innerHTML = '<span class="name">' + name.replace(/</g,'&lt;') + '</span>' +
                    '<span class="status">解析中…</span>';
    fileList.appendChild(div);
  }

  function markFileStatus(name, ok, msg) {
    var el = fileList.querySelector('.file-item[data-name="' + name.replace(/"/g, '&quot;') + '"]');
    if (!el) return;
    var st = el.querySelector('.status');
    if (ok) {
      st.className = 'status ok';
      st.textContent = '✓ 已解析 (' + Object.keys(filesData[name] || {}).length + ')';
    } else {
      st.className = 'status err';
      st.textContent = '✗ ' + msg;
    }
  }

  function populateFileSelector() {
    fileSelector.innerHTML = '';
    Object.keys(filesData).forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      fileSelector.appendChild(opt);
    });
    fileSelector.value = activeFile;
    viewerCard.style.display = Object.keys(filesData).length ? 'block' : 'none';
  }

  // ---- 下载格式化 JSON（复刻脚本输出）----
  function downloadFormatted() {
    if (!filesData[activeFile]) return;
    var base = activeFile.replace(/_sport_detail\.(json|txt)$/i, '').replace(/\.(json|txt)$/i, '');
    var d = filesData[activeFile];
    var payloads = [
      { name: base + '.hyroxRepLap.formatted.json', data: { hyroxRepLap: d.repLap } },
      { name: base + '.hyroxCounting.formatted.json', data: { hyroxCounting: d.counting } },
      { name: base + '.hyroxTimelines.formatted.json', data: { hyroxTimelines: d.timelines } }
    ];
    payloads.forEach(function (p) {
      var blob = new Blob([JSON.stringify(p.data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = p.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    });
    toastMsg('已下载 3 个格式化 JSON');
  }

  // ---- 极简 .xlsx 生成器（ZIP STORE + SpreadsheetML，纯前端无依赖）----
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(data) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // files: [{ name: string, data: Uint8Array }]，按 STORE（无压缩）打包 ZIP
  function buildZip(files) {
    var enc = new TextEncoder();
    var chunks = [];
    var central = [];
    var offset = 0;
    function push(a) { chunks.push(a); }

    files.forEach(function (f) {
      var nameBytes = enc.encode(f.name);
      var crc = crc32(f.data);
      var size = f.data.length;

      var lfh = new DataView(new ArrayBuffer(30));
      lfh.setUint32(0, 0x04034b50, true);
      lfh.setUint16(4, 20, true);
      lfh.setUint16(6, 0x0800, true);   // UTF-8 文件名
      lfh.setUint16(8, 0, true);        // method: store
      lfh.setUint16(10, 0, true); lfh.setUint16(12, 0, true);
      lfh.setUint32(14, crc, true);
      lfh.setUint32(18, size, true);
      lfh.setUint32(22, size, true);
      lfh.setUint16(26, nameBytes.length, true);
      lfh.setUint16(28, 0, true);
      push(new Uint8Array(lfh.buffer));
      push(nameBytes);
      push(f.data);

      var cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint16(10, 0, true);
      cd.setUint16(12, 0, true); cd.setUint16(14, 0, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, size, true);
      cd.setUint32(24, size, true);
      cd.setUint16(28, nameBytes.length, true);
      cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
      cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
      cd.setUint32(38, 0, true);
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer));
      central.push(nameBytes);

      offset += 30 + nameBytes.length + size;
    });

    var cdStart = offset;
    chunks = chunks.concat(central);
    var cdSize = chunks.reduce(function (s, c) { return s + c.length; }, 0) - cdStart;

    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
    eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, cdSize, true);
    eocd.setUint32(16, cdStart, true);
    eocd.setUint16(20, 0, true);
    chunks.push(new Uint8Array(eocd.buffer));

    var total = 0;
    chunks.forEach(function (c) { total += c.length; });
    var out = new Uint8Array(total);
    var pos = 0;
    chunks.forEach(function (c) { out.set(c, pos); pos += c.length; });
    return out;
  }

  function xmlEscape(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  function colLetter(i) { // 1-based -> A, B, ... Z, AA ...
    var s = '';
    while (i > 0) {
      var m = (i - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      i = Math.floor((i - 1) / 26);
    }
    return s;
  }

  function sheetXml(sheetName, rows) {
    var rowsArr = Array.isArray(rows) ? rows : [];
    var keys = collectKeys(rowsArr);
    var cols = [];
    var widths = keys.map(function (k) { return Math.min(45, Math.max(k.length + 2, 10)); });
    rowsArr.forEach(function (row) {
      keys.forEach(function (k, i) {
        var len = formatCell(row[k]).length;
        if (len + 2 > widths[i]) widths[i] = Math.min(50, len + 2);
      });
    });
    widths.forEach(function (w, i) {
      cols.push('<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>');
    });

    var L = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">',
      '<cols>', cols.join(''), '</cols>', '<sheetData>'];
    // 表头（加粗 s="1"）
    var header = ['<c r="A1" t="inlineStr" s="1"><is><t>#</t></is></c>'];
    keys.forEach(function (k, i) {
      header.push('<c r="' + colLetter(i + 2) + '1" t="inlineStr" s="1"><is><t>' + xmlEscape(k) + '</t></is></c>');
    });
    L.push('<row r="1">' + header.join('') + '</row>');
    rowsArr.forEach(function (row, ri) {
      var r = ri + 2;
      var cells = ['<c r="A' + r + '" t="inlineStr"><is><t>' + (ri + 1) + '</t></is></c>'];
      keys.forEach(function (k, ci) {
        var ref = colLetter(ci + 2) + r;
        var val = row[k];
        if (typeof val === 'number' && isFinite(val)) {
          cells.push('<c r="' + ref + '"><v>' + val + '</v></c>');
        } else {
          cells.push('<c r="' + ref + '" t="inlineStr"><is><t>' + xmlEscape(formatCell(val)) + '</t></is></c>');
        }
      });
      L.push('<row r="' + r + '">' + cells.join('') + '</row>');
    });
    L.push('</sheetData></worksheet>');
    return L.join('');
  }

  function workbookXml(sheets) {
    var L = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">',
      '<sheets>'];
    sheets.forEach(function (s, i) {
      L.push('<sheet name="' + xmlEscape(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>');
    });
    L.push('</sheets></workbook>');
    return L.join('');
  }

  function workbookRelsXml(count) {
    var L = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'];
    for (var i = 1; i <= count; i++) {
      L.push('<Relationship Id="rId' + i + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + i + '.xml"/>');
    }
    L.push('<Relationship Id="rId' + (count + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>');
    L.push('</Relationships>');
    return L.join('');
  }

  function contentTypesXml(count) {
    var L = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
      '<Default Extension="xml" ContentType="application/xml"/>',
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'];
    for (var i = 1; i <= count; i++) {
      L.push('<Override PartName="/xl/worksheets/sheet' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    }
    L.push('<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>');
    L.push('</Types>');
    return L.join('');
  }

  function stylesXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
      '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
      '</styleSheet>';
  }

  function downloadExcel() {
    if (!filesData[activeFile]) return;
    var base = activeFile.replace(/_sport_detail\.(json|txt)$/i, '').replace(/\.(json|txt)$/i, '');
    var d = filesData[activeFile];
    var sheets = [
      { name: 'hyroxRepLap', rows: d.repLap },
      { name: 'hyroxCounting', rows: d.counting },
      { name: 'hyroxTimelines', rows: d.timelines }
    ];
    var enc = new TextEncoder();
    var zipFiles = [
      { name: '[Content_Types].xml', data: enc.encode(contentTypesXml(sheets.length)) },
      { name: '_rels/.rels', data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>') },
      { name: 'xl/workbook.xml', data: enc.encode(workbookXml(sheets)) },
      { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(workbookRelsXml(sheets.length)) },
      { name: 'xl/styles.xml', data: enc.encode(stylesXml()) }
    ];
    sheets.forEach(function (s, i) {
      zipFiles.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: enc.encode(sheetXml(s.name, s.rows)) });
    });
    var zip = buildZip(zipFiles);
    var blob = new Blob([zip], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + '.formatted.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toastMsg('已下载 Excel: ' + a.download);
  }

  // ---- 事件绑定 ----
  dropZone.addEventListener('click', function () { fileInput.click(); });
  dropZone.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function (e) {
    handleFiles(e.target.files);
    fileInput.value = '';
  });
  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    activeTab = btn.getAttribute('data-key');
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('active', t === btn);
    });
    render();
  });
  fileSelector.addEventListener('change', function () {
    activeFile = fileSelector.value;
    render();
  });
  $('btnDownload').addEventListener('click', downloadFormatted);
  $('btnExcel').addEventListener('click', downloadExcel);

})();
</script>
</body>
</html>
